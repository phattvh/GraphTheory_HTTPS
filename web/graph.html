<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTTPS - Đồ thị Xung đột &amp; Xếp lịch DSatur</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <!-- Tailwind CSS & Cytoscape.js CDN theo 07. Technology stack.md -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js" integrity="sha384-H3uzGzTfGHUAumB8+s4GEdfFwzAceN9wCCndN8AXubWKFIPuBSWKKtWDx7RhSf/z" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="/css/layout.css" />
  <style>
    #tab-graph h2 {
      font-size: 1.375rem;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }
    #tab-graph h3 {
      font-size: 1.05rem;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }
    #graph-node-search::-webkit-calendar-picker-indicator {
      display: none !important;
      -webkit-appearance: none;
    }
  </style>
</head>
<body data-admin-page="graph" class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

  <div id="admin-layout-shell" class="flex-1 flex flex-col min-h-screen">
    <!-- Header 2 tầng & Right Collapsible Drawer được render dùng chung bởi web/js/admin/layout.js -->
    <div id="admin-shell-mount"></div>

    <main id="admin-main-content" class="flex-1 flex flex-col w-full p-6 space-y-5">
      <!-- MÀN HÌNH 03: ĐỒ THỊ XUNG ĐỘT & XẾP LỊCH DSATUR (UC08, UC09) -->
      <section id="tab-graph" class="admin-tab-section flex-1 space-y-5">

        <!-- Thanh tiêu đề & Bộ lọc 2 cấp Năm học -> Kỳ thi đồng bộ với trang Thống kê -->
        <header class="flex flex-wrap items-center justify-between gap-4 pb-3 border-b border-slate-200">
          <div>
            <h2 id="graph-page-heading" class="text-lg font-bold text-slate-900">
              Đồ thị Xung đột &amp; Xếp lịch Tự động
            </h2>
          </div>

          <div class="flex flex-wrap items-center gap-3 no-print">
            <div class="flex items-center gap-2">
              <label for="graph-year-select" class="text-xs font-semibold text-slate-600">Năm học:</label>
              <select
                id="graph-year-select"
                aria-label="Chọn năm học đồ thị"
                onchange="handleGraphYearChange()"
                class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold text-slate-800 focus:outline-none focus:border-blue-600"
              >
                <option value="2026 - 2027" selected>2026 - 2027</option>
                <option value="2025 - 2026">2025 - 2026</option>
              </select>
            </div>

            <div class="flex items-center gap-2">
              <label for="graph-exam-select" class="text-xs font-semibold text-slate-600">Kỳ thi:</label>
              <select
                id="graph-exam-select"
                aria-label="Chọn kỳ thi đồ thị"
                onchange="handleGraphExamChange()"
                class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold text-slate-800 focus:outline-none focus:border-blue-600"
              >
                <option value="KTHK1_2026" selected>KTHK1_2026 - Thi Cuối Kỳ HK1</option>
              </select>
            </div>
          </div>
        </header>

        <!-- Thanh công cụ Thuật toán, Tìm kiếm nhanh & Nút chạy Xếp lịch -->
        <div class="flex flex-wrap items-start justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm no-print">
          <div class="flex flex-wrap items-start gap-2.5">
            <!-- Chuyển đổi thuật toán DSatur / Welsh-Powell -->
            <div class="inline-flex items-center gap-1.5" role="group" aria-label="Chọn thuật toán tô màu">
              <button
                id="btn-algo-dsatur"
                type="button"
                aria-pressed="true"
                onclick="selectGraphAlgorithm('DSATUR')"
                class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white transition cursor-pointer"
              >
                DSatur
              </button>
              <button
                id="btn-algo-welsh-powell"
                type="button"
                aria-pressed="false"
                onclick="selectGraphAlgorithm('WELSH_POWELL')"
                class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 transition cursor-pointer"
              >
                Welsh-Powell
              </button>
            </div>

            <!-- Tìm kiếm & định vị nhanh đỉnh môn học -->
            <div class="flex flex-col w-72">
              <div class="relative w-full">
                <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input
                  id="graph-node-search"
                  type="search"
                  oninput="searchGraphNode(this.value)"
                  placeholder="Tìm mã môn (VD: IT002,...)"
                  aria-label="Tìm kiếm và định vị môn học trên đồ thị"
                  aria-describedby="graph-node-search-hint"
                  class="w-full pl-8 pr-3 py-1.5 rounded-lg text-xs font-medium bg-slate-50 hover:bg-slate-100 focus:bg-white text-slate-800 border border-slate-200 focus:border-blue-600 focus:outline-none transition"
                />
              </div>
              <p id="graph-node-search-hint" class="text-[11px] text-slate-400 leading-tight mt-1 pl-8 whitespace-nowrap">
                Các môn phải thi khác ca với môn bạn tìm
              </p>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <!-- Nút chạy xếp lịch tự động -->
            <button
              id="btn-run-schedule"
              type="button"
              onclick="runAutoSchedule()"
              class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-xs font-semibold text-white shadow-sm transition cursor-pointer"
            >
              <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
              <span>Chạy Xếp lịch Tự động</span>
            </button>
          </div>
        </div>

        <!-- Bố cục chính 2 cột: Canvas Đồ thị (8 cột) + Inspector & Verifier (4 cột) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

          <!-- CỘT TRÁI: Khung hiển thị Đồ thị Cytoscape.js -->
          <div id="cytoscape-container-shell" class="lg:col-span-8 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
            <!-- Tiêu đề khung đồ thị & Thanh trạng thái mô phỏng / xếp lịch -->
            <div class="flex flex-wrap items-center justify-between gap-2 px-5 py-3.5 border-b border-slate-200">
              <h3 class="text-sm font-bold text-slate-900">
                Đồ thị Xung đột Môn thi
              </h3>
            </div>

            <!-- Vùng Canvas tương tác Cytoscape.js + Nút Zoom nổi -->
            <div class="relative bg-slate-50/70">
              <div id="cy" class="w-full h-[500px]"></div>

              <svg id="cy-fallback-svg" class="absolute inset-4 w-[calc(100%-2rem)] h-[calc(100%-2rem)] pointer-events-none" viewBox="0 0 720 460" fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="360" y1="220" x2="200" y2="110" stroke="#94A3B8" stroke-width="3"/>
                <line x1="360" y1="220" x2="520" y2="110" stroke="#94A3B8" stroke-width="2.5"/>
                <line x1="360" y1="220" x2="180" y2="340" stroke="#94A3B8" stroke-width="2"/>
                <line x1="360" y1="220" x2="540" y2="340" stroke="#94A3B8" stroke-width="3"/>
                <line x1="200" y1="110" x2="520" y2="110" stroke="#CBD5E1" stroke-width="2"/>
                <line x1="200" y1="110" x2="180" y2="340" stroke="#CBD5E1" stroke-width="2"/>
                <line x1="520" y1="110" x2="540" y2="340" stroke="#CBD5E1" stroke-width="2"/>
                <line x1="180" y1="340" x2="360" y2="410" stroke="#CBD5E1" stroke-width="2"/>
                <line x1="540" y1="340" x2="360" y2="410" stroke="#CBD5E1" stroke-width="2"/>
                <line x1="200" y1="110" x2="90" y2="220" stroke="#CBD5E1" stroke-width="1.5"/>
                <line x1="520" y1="110" x2="630" y2="220" stroke="#CBD5E1" stroke-width="1.5"/>
                <circle cx="360" cy="220" r="40" fill="#2563EB" stroke="#1E3A8A" stroke-width="4"/>
                <text x="360" y="224" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">IT002</text>
                <circle cx="200" cy="110" r="33" fill="#10B981" stroke="#065F46" stroke-width="2"/>
                <text x="200" y="114" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">IT001</text>
                <circle cx="520" cy="110" r="33" fill="#F59E0B" stroke="#92400E" stroke-width="2"/>
                <text x="520" y="114" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">IT008</text>
                <circle cx="180" cy="340" r="31" fill="#8B5CF6" stroke="#5B21B6" stroke-width="2"/>
                <text x="180" y="344" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">IT003</text>
                <circle cx="540" cy="340" r="33" fill="#10B981" stroke="#065F46" stroke-width="2"/>
                <text x="540" y="344" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">IT006</text>
                <circle cx="360" cy="410" r="28" fill="#F59E0B" stroke="#92400E" stroke-width="2"/>
                <text x="360" y="414" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">IT004</text>
                <circle cx="90" cy="220" r="27" fill="#2563EB" stroke="#1E3A8A" stroke-width="2"/>
                <text x="90" y="224" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">IT005</text>
                <circle cx="630" cy="220" r="27" fill="#8B5CF6" stroke="#5B21B6" stroke-width="2"/>
                <text x="630" y="224" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">IT007</text>
              </svg>

              <!-- Nút xóa trạng thái Focus/Lọc nổi góc dưới trái -->
              <button
                id="btn-graph-clear-focus"
                type="button"
                onclick="clearGraphHighlight()"
                class="hidden absolute bottom-3 left-3 z-10 px-3 py-1.5 rounded-lg bg-white/95 hover:bg-slate-100 text-slate-700 border border-slate-300 shadow-sm text-xs font-semibold transition cursor-pointer"
              >
                Hiển thị toàn bộ đồ thị
              </button>

              <!-- Cụm điều khiển Zoom nổi góc dưới phải -->
              <nav aria-label="Điều khiển thu phóng đồ thị" class="absolute bottom-3 right-3 z-10 inline-flex items-center gap-1 no-print">
                <button
                  id="btn-graph-zoom-in"
                  type="button"
                  onclick="zoomInGraph()"
                  title="Phóng to"
                  aria-label="Phóng to đồ thị"
                  class="w-7 h-7 rounded-md text-xs font-bold bg-white/95 hover:bg-slate-100 text-slate-700 border border-slate-300 flex items-center justify-center transition cursor-pointer"
                >
                  +
                </button>
                <button
                  id="btn-graph-zoom-out"
                  type="button"
                  onclick="zoomOutGraph()"
                  title="Thu nhỏ"
                  aria-label="Thu nhỏ đồ thị"
                  class="w-7 h-7 rounded-md text-xs font-bold bg-white/95 hover:bg-slate-100 text-slate-700 border border-slate-300 flex items-center justify-center transition cursor-pointer"
                >
                  −
                </button>
                <button
                  id="btn-graph-fit"
                  type="button"
                  onclick="resetGraphView()"
                  title="Căn vừa khung hình"
                  class="px-2.5 h-7 rounded-md text-xs font-medium bg-white/95 hover:bg-slate-100 text-slate-700 border border-slate-300 flex items-center justify-center transition cursor-pointer"
                >
                  Mặc định
                </button>
                <span id="graph-zoom-label" class="h-7 px-2 rounded-md bg-white/95 border border-slate-200 inline-flex items-center text-[11px] font-mono font-semibold text-slate-600 tabular-nums">100%</span>
              </nav>
            </div>

            <!-- Thanh chú giải tương tác theo Ca thi (Click để lọc & kiểm chứng 0 cạnh cùng màu) -->
            <div id="graph-legend" class="flex flex-wrap items-center justify-between gap-2 px-5 py-3 border-t border-slate-200 bg-white text-xs">
              <div id="graph-legend-buttons" class="flex flex-wrap items-center gap-2"></div>
            </div>
          </div>

          <!-- CỘT PHẢI: Node/Edge Inspector + Schedule Verifier -->
          <div class="lg:col-span-4 space-y-5">
            <!-- Card Chi tiết Đỉnh / Cạnh đang chọn -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
                <h3 id="graph-inspector-heading" class="text-sm font-bold text-slate-900">
                  Cấu trúc Dữ liệu &amp; Giải thuật
                </h3>
                <span id="graph-inspector-badge" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800">
                  Mã học phần: IT002 (Ca 1)
                </span>
              </div>

              <ul id="graph-inspector-details" class="divide-y divide-slate-100 text-xs text-slate-700"></ul>
            </div>
          </div>

        </div>
      </section>
    </main>
  </div>

  <script src="/js/core/auth.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/admin/layout.js"></script>
  <script src="/js/admin/graph.js" defer></script>
</body>
</html>
