<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTTPS - Lịch thi toàn trường</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <!-- Tailwind CSS & FullCalendar v6 CDN theo 07. Technology stack.md -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js" integrity="sha384-B1OFx8Gy9GjPu8UbUyXbGQpzll9ubAUQ9agInFJ8NnD7nYG1u/CLR+Sqr5yifl4q" crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/vi.global.min.js" integrity="sha384-9+ItvXCAtpB5kTPSX3nOe9eCBfTjCEKdLd/Oo8lYa9pM4qPFgMUiIcSgX9BvvTcu" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="/css/layout.css" />
  <style>
    /* Phân cấp Typography chuẩn tỷ lệ >= 1.25:1 & tinh chỉnh FullCalendar (Data-Dense Academic Schedule) */
    #tab-calendar h2 {
      font-size: 1.375rem;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }
    #tab-calendar h3 {
      font-size: 1.05rem;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }
    #admin-fullcalendar {
      --fc-border-color: #e2e8f0;
      --fc-page-bg-color: #ffffff;
      --fc-neutral-bg-color: #f8fafc;
      --fc-today-bg-color: rgba(37, 99, 235, 0.05);
      --fc-now-indicator-color: #2563eb;
      font-family: inherit;
    }
    #admin-fullcalendar .fc-col-header,
    #admin-fullcalendar .fc-daygrid-body,
    #admin-fullcalendar .fc-scrollgrid-sync-table,
    #admin-fullcalendar .fc-timegrid-body,
    #admin-fullcalendar .fc-timegrid-cols table {
      width: 100% !important;
    }
    #admin-fullcalendar .fc-col-header-cell {
      background-color: #f8fafc;
      padding: 10px 4px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #1e293b;
      transition: width 180ms ease;
    }
    #admin-fullcalendar .fc-col-header-cell.is-empty-day-col {
      background-color: #f1f5f9;
      color: #64748b;
    }
    #admin-fullcalendar .fc-timegrid-col.is-empty-day-col,
    #admin-fullcalendar .fc-daygrid-day.is-empty-day-col {
      background-color: #fafafa;
    }
    #admin-fullcalendar tr.is-empty-week-row .fc-daygrid-day-frame {
      min-height: 44px !important;
    }
    #admin-fullcalendar .fc-timegrid-slot-label,
    #admin-fullcalendar .fc-daygrid-day-number {
      font-size: 0.74rem;
      font-weight: 600;
      color: #334155;
      font-variant-numeric: tabular-nums;
    }
    #admin-fullcalendar .fc-timegrid-axis-cushion,
    #admin-fullcalendar .fc-timegrid-slot-label-cushion {
      white-space: nowrap;
      padding: 6px 10px;
      font-weight: 700;
      color: #1e293b;
    }
    #admin-fullcalendar.is-shift-axis .fc-timegrid-slot {
      height: var(--https-shift-row-height, 9rem);
    }
    #admin-fullcalendar.is-shift-axis .fc-timegrid-slot-minor {
      border-top-style: solid;
    }
    #admin-fullcalendar.is-shift-axis .fc-timegrid-event-harness {
      left: 3px !important;
      right: 3px !important;
    }
    #admin-fullcalendar .fc-timegrid-event {
      margin: 3px 3px !important;
    }
    #calendar-search-input::-webkit-calendar-picker-indicator {
      display: none !important;
      -webkit-appearance: none;
    }
    #admin-fullcalendar .fc-event {
      border-width: 1.5px;
      border-style: solid;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.35;
      cursor: pointer;
      transition: transform 150ms ease, opacity 150ms ease;
    }
    #admin-fullcalendar .fc-event:hover {
      transform: translateY(-1px);
    }
    #admin-fullcalendar .fc-daygrid-event {
      white-space: normal;
      min-height: 62px;
      padding: 6px 8px;
      margin: 4px 3px !important;
      display: flex;
      align-items: center;
    }
    /* Khung chọn Năm học / Học kỳ / Tuần có nhãn nổi trên viền */
    .https-outlined-select-group {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .https-outlined-select-label {
      position: absolute;
      top: -7px;
      left: 10px;
      padding: 0 4px;
      background-color: #ffffff;
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1;
      color: #94a3b8;
      pointer-events: none;
    }
    .https-outlined-select {
      appearance: none;
      -webkit-appearance: none;
      padding: 7px 30px 6px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background-color: #ffffff;
      color: #1e293b;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.25;
      cursor: pointer;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .https-outlined-select:hover {
      border-color: #94a3b8;
    }
    .https-outlined-select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
    .https-outlined-select-arrow {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      color: #64748b;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      #admin-fullcalendar .fc-event {
        transition: none;
      }
    }
  </style>
</head>
<body data-admin-page="calendar" class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

  <div id="admin-layout-shell" class="flex-1 flex flex-col min-h-screen">
    <!-- Header 2 tầng & Right Collapsible Drawer được render dùng chung bởi web/js/admin/layout.js -->
    <div id="admin-shell-mount"></div>

    <main id="admin-main-content" class="flex-1 flex flex-col w-full p-6 space-y-5">
      <!-- MÀN HÌNH FIGMA 04: LỊCH THI TOÀN TRƯỜNG FULLCALENDAR (UC10, UC10.1) -->
      <section id="tab-calendar" class="admin-tab-section flex-1 space-y-5">

        <!-- Thanh tiêu đề kỳ thi, Chú giải 4 màu ca thi & Nút In Lịch Toàn Trường tách riêng nổi bật -->
        <header class="flex flex-wrap items-center justify-between gap-4 pb-3 border-b border-slate-200">
          <div>
            <h2 class="font-bold text-slate-900">Lịch thi toàn trường</h2>
          </div>

          <div class="flex flex-wrap items-center gap-4">
            <!-- Bảng chú giải màu sắc số Ca 1 -> Ca 4 -->
            <div class="flex flex-wrap items-center gap-3 text-xs" aria-label="Chú giải màu ca thi">
              <span class="inline-flex items-center gap-1.5 font-semibold text-blue-900">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-600" aria-hidden="true"></span>
                Ca 1: 7h30 - 9h00
              </span>
              <span class="inline-flex items-center gap-1.5 font-semibold text-emerald-900">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-600" aria-hidden="true"></span>
                Ca 2: 9h30 - 11h00
              </span>
              <span class="inline-flex items-center gap-1.5 font-semibold text-amber-900">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-600" aria-hidden="true"></span>
                Ca 3: 13h30 - 15h00
              </span>
              <span class="inline-flex items-center gap-1.5 font-semibold text-violet-900">
                <span class="w-2.5 h-2.5 rounded-full bg-violet-600" aria-hidden="true"></span>
                Ca 4: 15h30 - 17h00
              </span>
            </div>

            <!-- Nút In Lịch Toàn Trường (PDF) tách riêng và thiết kế khác biệt hoàn toàn -->
            <button type="button" id="btn-print-calendar" onclick="window.print()"
              class="no-print inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 shadow-sm ring-1 ring-blue-700/20 transition cursor-pointer">
              <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
              </svg>
              <span>In lịch toàn trường</span>
            </button>
          </div>
        </header>

        <!-- Thanh công cụ Tìm kiếm & Điều hướng Năm học / Học kỳ / Tuần / Chế độ xem -->
        <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200 no-print">
          <!-- Ô tìm kiếm duy nhất bên trái (gợi ý từ khóa chính qua datalist) -->
          <div class="relative flex-1 min-w-[240px] max-w-md">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="search"
              id="calendar-search-input"
              oninput="filterCalendarEvents()"
              placeholder="Tìm mã môn, tên môn, phòng thi, ca thi (VD: IT001, A101, Ca 1)..."
              aria-label="Tìm kiếm môn học, phòng thi hoặc ca thi"
              class="w-full pl-9 pr-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200/60 focus:bg-white text-slate-800 border border-transparent focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20 transition"
            />
            <datalist id="calendar-search-suggestions" class="hidden">
              <option value="IT001">IT001 - Lý thuyết Đồ thị</option>
              <option value="IT002">IT002 - Cấu trúc Dữ liệu &amp; Giải thuật</option>
              <option value="IT003">IT003 - Hệ Quản trị CSDL PostgreSQL</option>
              <option value="IT004">IT004 - Lập trình Web</option>
              <option value="IT005">IT005 - An toàn &amp; Bảo mật Thông tin</option>
              <option value="IT006">IT006 - Trí tuệ Nhân tạo</option>
              <option value="IT008">IT008 - Toán Rời rạc &amp; Tổ hợp</option>
              <option value="A101">Phòng thi A101</option>
              <option value="A102">Phòng thi A102</option>
              <option value="B201">Phòng thi B201</option>
              <option value="Ca 1">Ca 1: 7h30 - 9h00</option>
              <option value="Ca 2">Ca 2: 9h30 - 11h00</option>
              <option value="Ca 3">Ca 3: 13h30 - 15h00</option>
              <option value="Ca 4">Ca 4: 15h30 - 17h00</option>
            </datalist>
          </div>

          <!-- Cụm chọn Năm học / Học kỳ / Tuần & Chế độ xem Tuần / Tháng bên phải -->
          <div class="flex flex-wrap items-center gap-2.5">
            <!-- Ô chọn Năm học -->
            <div class="https-outlined-select-group">
              <label for="calendar-select-year" class="https-outlined-select-label">Năm học</label>
              <select id="calendar-select-year" onchange="handleAcademicPeriodChange('year')"
                aria-label="Chọn năm học"
                class="https-outlined-select min-w-[118px] tabular-nums">
                <option value="2025-2026">2025-2026</option>
                <option value="2026-2027" selected>2026-2027</option>
                <option value="2027-2028">2027-2028</option>
              </select>
              <svg class="https-outlined-select-arrow" viewBox="0 0 10 6" fill="currentColor" aria-hidden="true">
                <path d="M0 0.5L5 5.5L10 0.5H0Z" />
              </svg>
            </div>

            <!-- Ô chọn Học kỳ -->
            <div class="https-outlined-select-group">
              <label for="calendar-select-semester" class="https-outlined-select-label">Học kỳ</label>
              <select id="calendar-select-semester" onchange="handleAcademicPeriodChange('semester')"
                aria-label="Chọn học kỳ"
                class="https-outlined-select min-w-[116px]">
                <option value="HK1" selected>Học kỳ 1</option>
                <option value="HK2">Học kỳ 2</option>
                <option value="HK3">Học kỳ hè</option>
              </select>
              <svg class="https-outlined-select-arrow" viewBox="0 0 10 6" fill="currentColor" aria-hidden="true">
                <path d="M0 0.5L5 5.5L10 0.5H0Z" />
              </svg>
            </div>

            <!-- Ô chọn Tuần (Hiện khi ở chế độ xem Tuần, ẩn khi ở chế độ xem Tháng) -->
            <div id="calendar-week-select-group" class="https-outlined-select-group">
              <label for="calendar-select-week" class="https-outlined-select-label">Tuần</label>
              <select id="calendar-select-week" onchange="handleAcademicPeriodChange('week')"
                aria-label="Chọn tuần thi"
                class="https-outlined-select min-w-[188px] tabular-nums">
                <option value="2026-12-07">07/12/2026-13/12/2026</option>
                <option value="2026-12-15" selected>14/12/2026-20/12/2026</option>
                <option value="2026-12-21">21/12/2026-27/12/2026</option>
                <option value="2027-01-18">18/01/2027-24/01/2027</option>
              </select>
              <svg class="https-outlined-select-arrow" viewBox="0 0 10 6" fill="currentColor" aria-hidden="true">
                <path d="M0 0.5L5 5.5L10 0.5H0Z" />
              </svg>
            </div>

            <!-- Ô chọn Tháng (Ẩn khi ở chế độ xem Tuần, hiện ra giống ô Tuần khi bấm sang chế độ xem Tháng) -->
            <div id="calendar-month-select-group" class="https-outlined-select-group hidden">
              <label for="calendar-select-month" class="https-outlined-select-label">Tháng</label>
              <select id="calendar-select-month" onchange="handleAcademicPeriodChange('month')"
                aria-label="Chọn tháng thi"
                class="https-outlined-select min-w-[156px] tabular-nums">
                <option value="2026-11-01">Tháng 11/2026</option>
                <option value="2026-12-15" selected>Tháng 12/2026</option>
                <option value="2027-01-01">Tháng 01/2027</option>
                <option value="2027-05-01">Tháng 05/2027</option>
                <option value="2027-06-01">Tháng 06/2027</option>
              </select>
              <svg class="https-outlined-select-arrow" viewBox="0 0 10 6" fill="currentColor" aria-hidden="true">
                <path d="M0 0.5L5 5.5L10 0.5H0Z" />
              </svg>
            </div>

            <span class="h-4 w-[1px] bg-slate-200 mx-0.5" aria-hidden="true"></span>

            <!-- Chuyển chế độ xem Tuần (timeGridWeek) & Tháng (dayGridMonth) -->
            <button type="button" id="btn-view-week" data-calendar-view="timeGridWeek"
              aria-pressed="true" onclick="switchCalendarView('timeGridWeek')"
              class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white transition cursor-pointer">
              Tuần
            </button>

            <button type="button" id="btn-view-month" data-calendar-view="dayGridMonth"
              aria-pressed="false" onclick="switchCalendarView('dayGridMonth')"
              class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-700 hover:text-slate-900 transition cursor-pointer">
              Tháng
            </button>
          </div>
        </div>

        <!-- Khung chính hiển thị thuần FullCalendar (Tuần / Tháng) -->
        <div id="admin-fullcalendar-shell" class="bg-white p-6 rounded-xl border border-slate-200 space-y-5">
          <!-- Tiêu đề động đồng bộ với chế độ xem FullCalendar -->
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-200">
            <div class="flex flex-wrap items-center gap-3">
              <span id="calendar-view-badge" class="px-2.5 py-1 rounded-md text-xs font-bold bg-blue-50 text-blue-800">
                Chế độ xem: Tuần
              </span>
              <h3 id="calendar-current-range" class="font-bold text-slate-900 tabular-nums">
                Tuần thi: Thứ Hai 15/12/2026 - Thứ Bảy 20/12/2026
              </h3>
            </div>
          </div>

          <!-- Container mount trực tiếp của thư viện FullCalendar.js -->
          <div id="admin-fullcalendar" class="is-shift-axis w-full" aria-label="Lịch thi toàn trường FullCalendar"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/core/auth.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/admin/layout.js"></script>
  <script src="/js/admin/calendar.js" defer></script>
</body>
</html>
