services:
  postgres:
    image: postgres:16-alpine
    container_name: graphtheory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam_pass}
      POSTGRES_DB: ${POSTGRES_DB:-graphtheory_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-exam_user} -d ${POSTGRES_DB:-graphtheory_db}",
        ]
      interval: 3s
      timeout: 3s
      retries: 15

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: graphtheory_fastapi
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam_user}:${POSTGRES_PASSWORD:-exam_pass}@postgres:5432/${POSTGRES_DB:-graphtheory_db}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: graphtheory_caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fastapi

volumes:
  pg_data:
  caddy_data:
  caddy_config:
